apiVersion: v1
kind: Pod
metadata:
  name: nextcloud-dev
  labels:
    app: nextcloud-dev
    # test silos of the cluster: only this user may start one (run_pod checks user+domain)
    user: fror
    domain: dtu.dk
  annotations:
    catalog/title: "Nextcloud"
    catalog/category: "Storage services"
    catalog/summary: "Your own Nextcloud server, serving data off your ScienceData storage"
    catalog/featured: "0"
spec:
  # time for start.sh to save the pod state at shutdown (default 30 s is too short)
  terminationGracePeriodSeconds: 600
  containers:
  - name: nextcloud-dev
    image: sciencedata/nextcloud_dev
    volumeMounts:
      - name: sciencedata
        mountPath: "/var/www"
    ports:
    - containerPort: 80
      protocol: TCP
    - containerPort: 22
      protocol: TCP
    env:
    - name: SSH_PUBLIC_KEY
      value: ""
    - name: USERNAME
      value: "www"
    - name: SD_UID
      value: ""
    - name: HOME_SERVER
      value: ""
    - name: PUBLIC_HOME_SERVER
      value: ""
    - name: HTTPS_PORT
      value: ""
    - name: NFS_RW
      value: "yes"
#    - name: SETUP_SCRIPT
#      value: "/var/www/setup.sh"
    securityContext:
      capabilities:
        add:
          - "SYS_CHROOT"
          - "AUDIT_WRITE"
          - "NET_ADMIN"
  restartPolicy: Never
