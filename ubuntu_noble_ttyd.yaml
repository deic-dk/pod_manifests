apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-noble-ttyd
  labels:
    app: ubuntu-noble-ttyd
    types: small-medium-large
  annotations:
    catalog/title: "Ubuntu 24.04 with browser terminal"
    catalog/category: "Linux"
    catalog/summary: "A shell in the browser, next to your files"
    catalog/featured: "1"
spec:
  containers:
  - name: ubuntu-noble-ttyd
    image: sciencedata/ubuntu_noble_ttyd
    ports:
    - containerPort: 22
      protocol: TCP
    - containerPort: 7681
      protocol: TCP
    env:
    - name: SSH_PUBLIC_KEY
      value: ""
    - name: USERNAME
      value: "sciencedata"
    - name: HOME_SERVER
      value: ""
    - name: SD_UID
      value: ""
    - name: PUBLIC_HOME_SERVER
      value: ""
    - name: NFS_RW
      value: "yes"
    - name: POD_HTTP_PORT
      value: "7681"
    securityContext:
      capabilities:
        add:
          - "SYS_CHROOT"
          - "AUDIT_WRITE"
          - "NET_ADMIN"
  restartPolicy: Never
