apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-noble-overleaf
  labels:
    app: ubuntu-noble-overleaf
    types: medium-large
    # trial: only this user may start one (run_pod checks user+domain)
    user: fror
    domain: dtu.dk
spec:
  # time to flush open documents and upload the backup at shutdown
  terminationGracePeriodSeconds: 900
  containers:
  - name: ubuntu-noble-overleaf
    image: sciencedata/ubuntu_noble_overleaf_sciencedata
    ports:
    - containerPort: 80
      protocol: TCP
    - containerPort: 22
      protocol: TCP
    env:
    - name: SSH_PUBLIC_KEY
      value: ""
    - name: USERNAME
      value: "root"
    - name: HOME_SERVER
      value: ""
    - name: PUBLIC_HOME_SERVER
      value: ""
    - name: SD_UID
      value: ""
    - name: HTTPS_PORT
      value: ""
    securityContext:
      capabilities:
        add:
          - "SYS_CHROOT"
          - "AUDIT_WRITE"
          - "NET_ADMIN"
  restartPolicy: Never
