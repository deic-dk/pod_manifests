apiVersion: v1
kind: Pod
metadata:
  name: jupyter-pytorch
  labels:
    types: small-medium-large-gpu1-gpu4
  annotations:
    catalog/title: "PyTorch"
    catalog/category: "Machine learning"
    catalog/summary: "Jupyter Notebook server plus Pytorch"
    catalog/featured: "0"
    catalog/wait-for-token: "1"
spec:
  # The scientific Python stack in this image (numpy, scipy, ...) needs AVX and dies
  # with "Illegal instruction" on the cluster's AVX-less Opterons. Nodes with AVX
  # carry avx-present=yes (mfslinux install_kubernetes).
  nodeSelector:
    avx-present: "yes"
  containers:
  - name: jupyter-pytorch
    image: sciencedata/jupyter_sciencedata_pytorch
    volumeMounts:
      - mountPath: /dev/shm
        name: dshm
    ports:
    - containerPort: 8888
      protocol: TCP
    env:
    - name: HOME_SERVER
      value: ""
    - name: SD_UID
      value: ""
    - name: SD_GID
      value: ""
    - name: POD_HTTP_PORT
      value: "8888"
    - name: FILE
      value: ""
    - name: CUDA_VISIBLE_DEVICES_NUM
      value: "0"
    securityContext:
      capabilities:
        add:
          - "SYS_CHROOT"
          - "AUDIT_WRITE"
          - "NET_ADMIN"
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
  

