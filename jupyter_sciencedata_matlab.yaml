apiVersion: v1
kind: Pod
metadata:
  name: jupyter-matlab
  labels:
    # large only: MATLAB R2025b needs > 2 GiB to draw figures (OOM-killed in medium)
    types: large
  annotations:
    catalog/title: "Matlab"
    catalog/category: "Scientific computing"
    catalog/summary: "Jupyter Notebook server with MATLAB kernel"
    catalog/featured: "0"
    catalog/wait-for-token: "1"
spec:
  # The scientific Python stack in this image (numpy, scipy, ...) needs AVX and dies
  # with "Illegal instruction" on the cluster's AVX-less Opterons. Nodes with AVX
  # carry avx-present=yes (mfslinux install_kubernetes).
  nodeSelector:
    avx-present: "yes"
  containers:
  - name: jupyter-matlab
    image: sciencedata/jupyter_sciencedata_custom
    ports:
    - containerPort: 8888
      protocol: TCP
    env:
    - name: HOME_SERVER
      value: ""
    - name: SD_UID
      value: ""
    - name: MATLAB_LICENSE_SERVER
      value: "license-relay"
    - name: MATLAB_LICENSE_PORT
      value: "1711"
    - name: MMA_LICENSE_SERVER
      value: "license-relay"
    - name: SETUP_MATLAB
      value: "true"
    - name: SETUP_MATHEMATICA
      value: ""
    - name: MOUNT_SRC
      value: "/usr/local/software"
    - name: MOUNT_DEST
      value: "/usr/local/software"
    - name: POD_HTTP_PORT
      value: "8888"
    - name: FILE
      value: ""
    securityContext:
      capabilities:
        add:
          - "SYS_CHROOT"
          - "AUDIT_WRITE"
          - "NET_ADMIN"
