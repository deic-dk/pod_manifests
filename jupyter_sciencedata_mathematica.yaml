apiVersion: v1
kind: Pod
metadata:
  name: jupyter-mathematica
  labels:
    types: small-medium-large
  annotations:
    catalog/title: "Mathematica"
    catalog/category: "Scientific computing"
    catalog/summary: "Jupyter Notebook server with Wolfram/Mathematica kernel"
    catalog/featured: "0"
    catalog/wait-for-token: "1"
spec:
  # The scientific Python stack in this image (numpy, scipy, ...) needs AVX and dies
  # with "Illegal instruction" on the cluster's AVX-less Opterons. Nodes with AVX
  # carry avx-present=yes (mfslinux install_kubernetes).
  # MATLAB/Mathematica come from the node's /usr/local/software (hostPath, not checked
  # by Kubernetes): nodes that have it carry software-present=yes (mfslinux
  # install_science_software). connect is not labelled - its traffic does not leave
  # via kube, for whose address DTU's license servers are opened.
  nodeSelector:
    avx-present: "yes"
    software-present: "yes"
  containers:
  - name: jupyter-mathematica
    image: sciencedata/jupyter_sciencedata_custom
    ports:
    - containerPort: 8888
      protocol: TCP
    env:
    - name: HOME_SERVER
      value: ""
    - name: SD_UID
      value: ""
    - name: MATLAB_LICENSE_SERVER
      value: "licenses"
    - name: MATLAB_LICENSE_PORT
      value: "1711"
    - name: MMA_LICENSE_SERVER
      value: "licenses"
    - name: SETUP_MATLAB
      value: ""
    - name: SETUP_MATHEMATICA
      value: "true"
    - name: MOUNT_SRC
      value: "/usr/local/software"
    - name: MOUNT_DEST
      value: "/usr/local/software"
    - name: POD_HTTP_PORT
      value: "8888"
    - name: FILE
      value: ""
    securityContext:
      capabilities:
        add:
          - "SYS_CHROOT"
          - "AUDIT_WRITE"
          - "NET_ADMIN"
    lifecycle:
      postStart:
        exec:
          command: ["/bin/bash", "-c", "mkdir -p /home/sciencedata/.WolframEngine/Licensing/"]
          command: ["/bin/bash", "-c", "curl --insecure https://sciencedata/files/mathpass -o /home/sciencedata/.WolframEngine/Licensing/mathpass >& /dev/null || echo 'no mathpass'"]
      preStop:
        exec:
          command: ["/bin/bash","-c","[ -s /home/sciencedata/.WolframEngine/Licensing/mathpass ] && curl --insecure --upload /home/sciencedata/.WolframEngine/Licensing/mathpass https://sciencedata/files/mathpass"]
