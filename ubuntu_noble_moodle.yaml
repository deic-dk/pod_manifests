apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-noble-moodle
  labels:
    app: ubuntu-noble-moodle
    # trial: only this user may start one (run_pod checks user+domain)
    user: fror
    domain: dtu.dk
  annotations:
    catalog/title: "Moodle"
    catalog/category: "Teaching and collaboration"
    catalog/summary: "Your own Moodle learning platform, with its files on your ScienceData storage"
    catalog/featured: "0"
    # used through its web page; an SSH key only adds a root shell
    catalog/ssh-optional: "1"
    # log in with ScienceData: may be started for a group, whose members then
    # log in with their accounts; just for the owner, only the owner can
    catalog/oidc: "1"
    # the Containers page shows "Starting..." until the image writes /tmp/URI
    catalog/wait-for-token: "1"
    # ubuntu_noble_moodle.guide.md: shown by the Containers app (Guide link)
    catalog/guide: "1"
spec:
  # time for start.sh to dump and upload the database at shutdown (default 30 s is too short)
  terminationGracePeriodSeconds: 600
  containers:
  - name: ubuntu-noble-moodle
    image: sciencedata/ubuntu_noble_moodle_sciencedata
    # Placement, not a limit: only nodes with 4 free CPUs (worker1, connect, peon141),
    # not the 4-core ones. Load test 2026-11-25: on 4 cores Moodle was CPU-bound at
    # ~35 req/s (200 students at once: ~5 s per page); the image sets 4 PHP-FPM
    # workers per CPU, so a bigger node serves a deadline rush correspondingly faster.
    resources:
      requests:
        cpu: "4"
        memory: "2Gi"
    volumeMounts:
      - name: sciencedata
        mountPath: "/var/moodledata"
    ports:
    - containerPort: 80
      protocol: TCP
    - containerPort: 22
      protocol: TCP
    env:
    - name: SSH_PUBLIC_KEY
      value: ""
    - name: USERNAME
      value: "www"
    - name: SD_UID
      value: ""
    - name: HOME_SERVER
      value: ""
    - name: PUBLIC_HOME_SERVER
      value: ""
    - name: HTTPS_PORT
      value: ""
    - name: NFS_VOLUME_PATH
      value: ""
    - name: NFS_RW
      value: "yes"
    securityContext:
      capabilities:
        add:
          - "SYS_CHROOT"
          - "AUDIT_WRITE"
          - "NET_ADMIN"
  restartPolicy: Never
